# Long-generation sensitivity / final GSM8K reproduction configuration.
# Keep separate from configs/eval_qwen3_14b_to_32b.yaml (frozen pinned-256 run).
project_root: /home/wby/llm-cache/nvidia-kvcache
benchmark_manifest: data/benchmarks/manifest.json
local_task_dir: data/benchmarks/lm_eval_tasks

completion_mode: true
apply_chat_template: false
boundary_replay: true
batch_size: 1

paths:
  source_model: /home/wby/models/Qwen3-14B
  target_model: /home/wby/models/Qwen3-32B
  mapper_manifest: artifacts/mappers/qwen3_14b_to_32b/k8_lambda0.01/manifest.json
  harness_root: vendor/lm-evaluation-harness

runtime:
  target_devices: [0, 1, 2, 3]
  source_devices: [4, 5]
  attention_implementation: flash_attention_2
  mapper_token_chunk: 1024
  max_gen_tokens: 1024

benchmarks:
  arc_challenge:
    num_fewshot: 0
    metric: acc_norm
  hellaswag:
    num_fewshot: 0
    metric: acc_norm
  winogrande:
    num_fewshot: 0
    metric: acc
  mmlu:
    num_fewshot: 5
    metric: acc
  gsm8k_cot:
    num_fewshot: 8
    metric: exact_match
    metric_filter: strict-match
    mode: greedy_generation_cot
  wikitext2_prefix_ppl:
    metric: perplexity
    chunk_length: 2048
    prefix_length: 1024
    scored_length: 1024
    dataset_path: EleutherAI/wikitext_document_level
    dataset_name: wikitext-2-raw-v1
    split: test
    text_field: page
    document_separator: "\n\n"
    revision: null
