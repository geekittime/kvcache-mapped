schema_version: 1
direction: qwen3_32b_to_14b
paper_reference:
  paper: arXiv:2608.03893v1
  section: "4.6"
  disclosed: "100 conversations, five domains, word F1 at handoff depths 1,3,5,7,10, k=20"
  figure_evidence: "official arXiv source figures/retention_vs_turns.png; x-axis Turn depth at handoff"
  undisclosed: "conversation IDs, selection seed, prompt, history policy, decoding settings"

dataset:
  provider: ModelScope
  repository: EleutherAI/coqa
  revision: 5153eac35fe087e44d9ce99ebb2d94c3dbc81583
  split: validation
  file: /home/wby/llm-cache/nvidia-kvcache/data/coqa/coqa_validation.parquet
  expected_sha256: 5ab4d352067c30ef4925efb0dfb2abeeed4cdfb236304aa7ee9df62ea781281f
  expected_nbytes: 2221232

selection:
  namespace: qwen3_32b_to_14b_coqa_v1
  domains: [children_stories, literature, mid-high_school, news, wikipedia]
  conversations_per_domain: 20
  minimum_turns: 10
  headline_handoff_depths: [1, 3, 5, 7, 10]
  ranking: "ascending sha256(namespace + NUL + conversation_id)"
  gold_independent: true

prompt:
  template_version: eleutherai_coqa_completion_gold_history_v1
  completion_mode: true
  apply_chat_template: false
  thinking_disabled_by_no_chat_template: true
  prior_answer_history: gold_primary_answer
  answer_instruction: none
  cache_history_execution: persistent_incremental_token_deltas_full_history_prefill_once
  incremental_tokenization: encode_segments_and_require_exact_full_prompt_token_equality

generation:
  do_sample: false
  temperature: 0
  max_new_tokens: 128
  stop_sequences: ["\nQ:"]
  context_overflow: error

metric:
  primary: official_normalized_word_f1
  primary_evaluator: stanford_coqa_evaluate_v1.0
  official_evaluator_url: https://nlp.stanford.edu/data/coqa/evaluate-v1.0.py
  official_evaluator_sha256: d42f70d686abc724a9169947a487f4509087ee69804277cc73950682cb700b4d
  stored_primary_scale: fraction_0_to_1_with_percent_companion
  aggregation: macro_over_conversation_handoff_depth_records
  multiple_references: leave_one_out_average_of_max_over_remaining_references
  reference_set: primary_plus_three_additional_human_annotations
  reference_deduplication: none_preserve_official_annotator_multiplicity
  response_postprocess: lm_eval_first_line_only
  lm_eval_reference_difference: vendored_doc_to_target_case_insensitive_dedup_is_not_used
  diagnostic: format_relaxed_official_normalized_word_f1

paths:
  source_model: /home/wby/models/Qwen3-32B
  target_model: /home/wby/models/Qwen3-14B
  mapper_manifest: ../artifacts/mappers/qwen3_32b_to_14b/k20_lambda0.01/manifest.json

runtime:
  source_devices: [0, 1, 2, 3, 4]
  source_layer_counts: [12, 13, 14, 13, 12]
  target_devices: [5, 6, 7]
  target_layer_counts: [13, 14, 13]
  attention_implementation: flash_attention_2
  mapper_token_chunk: 1024
  max_context_tokens: 32768
